services:
  # =========================================================================
  # 1. DATABASE SERVICE (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: chemistfun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chemistfun_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chemistfun_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chemistfun_network

  # =========================================================================
  # 2. BACKEND SERVICE (FastAPI)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chemistfun_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chemistfun_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - chemistfun_network

  # =========================================================================
  # 3. FRONTEND SERVICE (Vue.js 3 / Vite)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chemistfun_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - chemistfun_network

volumes:
  postgres_data:
    driver: local

networks:
  chemistfun_network:
    driver: bridge

