services:
  # =========================================================================
  # 1. DATABASE SERVICE (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: KimiFun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-KimiFun_db}
    ports:
      # Bind to 127.0.0.1 to avoid exposing database directly to public network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-KimiFun_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - KimiFun_network

  # =========================================================================
  # 2. BACKEND SERVICE (FastAPI)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: KimiFun_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-KimiFun_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-KimiFun-insecure-development-secret-key-change-in-production-1234567890}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      AI_PROVIDER: ${AI_PROVIDER:-9router}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-https://api.9router.com/v1}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-ag/gemini-1.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      # Bind to 127.0.0.1; frontend proxies /api to http://backend:8000 via internal Docker network
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 ${UVICORN_EXTRA_ARGS:---reload}
    networks:
      - KimiFun_network

  # =========================================================================
  # 3. FRONTEND SERVICE (Vue.js 3 / Vite)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: KimiFun_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - KimiFun_network

volumes:
  postgres_data:
    driver: local

networks:
  KimiFun_network:
    driver: bridge

